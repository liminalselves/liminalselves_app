name: android

# develop 推送与 PR：编译 APK 并上传为 Actions artifact，用于预发布测试。
# master 推送（release/hotfix PR 合并）：按 pubspec.yaml 版本自动创建 v<版本> 标签和 GitHub Release，
# 附正式签名 APK，说明取自 docs/CHANGELOG.md 对应版本小节，并标记为 Latest。
on:
  push:
    branches: [develop, master]
  pull_request:
    branches: [develop, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  # master 的发布不能被后一次推送中途取消
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

env:
  IS_RELEASE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}

jobs:
  verify-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: 读取版本号
        id: version
        run: echo "version=$(sed -nE 's/^version:[[:space:]]*([^+[:space:]]+).*/\1/p' pubspec.yaml)" >> "$GITHUB_OUTPUT"
      # 同一版本只发布一次：标签已存在且指向别的提交，说明合并前忘了升版本号
      - name: 校验版本未发布过
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          existing="$(git rev-parse -q --verify "refs/tags/v$VERSION^{commit}" || true)"
          if [ -n "$existing" ] && [ "$existing" != "$GITHUB_SHA" ]; then
            echo "::error::v$VERSION 已发布（$existing），请先在 release 分支升级 pubspec.yaml 版本号"
            exit 1
          fi
      - name: 校验 CHANGELOG 小节
        run: python3 scripts/changelog-section.py "${{ steps.version.outputs.version }}" > /dev/null

  build:
    needs: verify-release
    # verify-release 只在 master 推送时运行；其余场景它被跳过，build 照常执行
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle.kts
            android/gradle/wrapper/gradle-wrapper.properties
      # gradlew 脚本未入库，按 wrapper 配置的版本直接安装官方 Gradle
      - name: 安装 Gradle
        run: |
          url="$(sed -nE 's#^distributionUrl=(.*)#\1#p' android/gradle/wrapper/gradle-wrapper.properties | sed 's#\\:#:#')"
          curl -fsSL "$url" -o "$RUNNER_TEMP/gradle.zip"
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$(echo "$RUNNER_TEMP"/gradle-*/bin)" >> "$GITHUB_PATH"
      - name: 写入签名配置
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            if [ "$IS_RELEASE" = "true" ]; then
              echo "::error::缺少签名 secrets（配置说明见 docs/RELEASE.md）"
              exit 1
            fi
            echo "::warning::未配置签名 secrets，本次 APK 使用 debug 签名，不能覆盖安装正式版"
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > android/upload-keystore.jks
          {
            echo "storeFile=upload-keystore.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties
      - name: 构建 APK 并检查 lint
        env:
          MISSKEY_URL: ${{ vars.MISSKEY_URL }}
        run: |
          args=(assembleRelease lintRelease --console=plain)
          if [ -n "$MISSKEY_URL" ]; then args+=("-PmisskeyUrl=$MISSKEY_URL"); fi
          gradle -p android "${args[@]}"
      - name: 整理产物
        run: |
          version="$(sed -nE 's/^version:[[:space:]]*([^+[:space:]]+).*/\1/p' pubspec.yaml)"
          if [ "$IS_RELEASE" = "true" ]; then
            name="LiminalSelves_v${version}.apk"
          else
            name="LiminalSelves_v${version}-${GITHUB_SHA::7}.apk"
          fi
          mkdir -p dist
          cp build/app/outputs/apk/release/app-release.apk "dist/$name"
      - uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: dist/*.apk
          if-no-files-found: error

  release:
    needs: [verify-release, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: v${{ needs.verify-release.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: android-apk
          path: dist
      - name: 提取版本说明
        run: python3 scripts/changelog-section.py "$TAG" > release-notes.md
      # 标签由本步骤在当前提交上创建；显式 --latest，仓库首页与 releases/latest 始终指向本次发布
      - name: 发布 GitHub Release
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.apk --clobber
            gh release edit "$TAG" --notes-file release-notes.md --latest
          else
            gh release create "$TAG" dist/*.apk --target "$GITHUB_SHA" --notes-file release-notes.md --title "阈界人格 ${TAG#v}" --latest
          fi
          test "$(gh release view --json tagName -q .tagName)" = "$TAG"
