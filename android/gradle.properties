org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Kotlin 增量缓存偶发 "Storage is already registered" / Could not close incremental caches：先 flutter clean 并删 build，仍失败再取消下一行注释（构建会稍慢）
# kotlin.incremental=false
# Flutter 引擎 AAR（io.flutter:*）见 settings.gradle.kts。可选在系统环境设置 FLUTTER_STORAGE_BASE_URL（如 https://storage.flutter-io.cn）
# 部分环境下与 Maven 仓库 TLS 握手相关（可选）
systemProp.https.protocols=TLSv1.2,TLSv1.3
systemProp.jdk.tls.client.protocols=TLSv1.2,TLSv1.3
